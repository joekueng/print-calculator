name: PR Checks

on:
  pull_request:
    branches: [main, int, dev]

concurrency:
  group: print-calculator-pr-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  prettier-autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply formatting with Prettier
        shell: bash
        run: |
          npx --yes prettier@3.6.2 --write \
            "frontend/src/**/*.{ts,html,scss,css,json}" \
            ".gitea/workflows/*.{yml,yaml}"

      - name: Commit and push formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi

          EVENT_FILE="${GITHUB_EVENT_PATH:-}"
          if [[ -z "$EVENT_FILE" || ! -f "$EVENT_FILE" ]]; then
            echo "Event payload not found, skipping auto-push."
            exit 0
          fi

          HEAD_REPO="$(node -p "require(process.argv[1]).pull_request?.head?.repo?.full_name || ''" "$EVENT_FILE")"
          BASE_REPO="$(node -p "require(process.argv[1]).repository?.full_name || ''" "$EVENT_FILE")"
          PR_BRANCH="$(node -p "require(process.argv[1]).pull_request?.head?.ref || ''" "$EVENT_FILE")"

          if [[ -z "$PR_BRANCH" ]]; then
            echo "PR branch not found in event payload, skipping auto-push."
            exit 0
          fi

          if [[ -n "$HEAD_REPO" && -n "$BASE_REPO" && "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "PR from fork ($HEAD_REPO), skipping auto-push."
            exit 0
          fi

          git config user.name "printcalc-ci"
          git config user.email "ci@printcalculator.local"

          git add frontend/src .gitea/workflows
          git commit -m "style: apply prettier formatting"
          git push origin "HEAD:${PR_BRANCH}"

  security-sast:
    needs: prettier-autofix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        shell: bash
        run: python -m pip install --disable-pip-version-check semgrep==1.176.1

      - name: Run Semgrep (SAST)
        shell: bash
        run: |
          semgrep --version
          semgrep --config auto --error \
            --exclude frontend/node_modules \
            --exclude backend/build \
            backend/src frontend/src

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          VERSION="8.24.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks (secrets scan)
        shell: bash
        run: |
          set +e
          gitleaks detect --source . --no-git --redact --exit-code 1 \
            --report-format json --report-path /tmp/gitleaks-report.json
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "Gitleaks findings:"
            cat /tmp/gitleaks-report.json
          fi
          exit $rc

  test-backend:
    needs: prettier-autofix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Run Tests with Gradle
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew test

  test-frontend:
    needs: prettier-autofix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Google Chrome
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
            -o /tmp/google-linux-signing-key.pub
          gpg --dearmor --yes \
            -o /etc/apt/keyrings/google-chrome.gpg \
            /tmp/google-linux-signing-key.pub
          chmod 0644 /etc/apt/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" \
            > /etc/apt/sources.list.d/google-chrome.list
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends google-chrome-stable
          CHROME_PATH="$(command -v google-chrome-stable)"
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd frontend
          npm ci --no-audit --no-fund --prefer-offline

      - name: Run frontend tests (headless)
        shell: bash
        env:
          CI: "true"
        run: |
          cd frontend
          echo "Karma CHROME_BIN=$CHROME_BIN"
          npm run test -- --watch=false --browsers=ChromeHeadlessNoSandbox
