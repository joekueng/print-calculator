<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${language}">
<head>
<meta charset="utf-8"/>
<style>
@page invoice { size: A4; margin: 18mm 18mm 18mm;
  @bottom-left { content: "3D Fab Küng Caletti · info@3dfab.ch"; font-family: Helvetica, sans-serif; font-size: 8pt; color: #666; }
  @bottom-right { content: counter(page); font-family: Helvetica, sans-serif; font-size: 8pt; color: #666; }
}
@page qrpage { size: A4; margin: 0; }
body { page: invoice; font-family: Helvetica, Arial, sans-serif; font-size: 10pt; line-height: 1.45; color: #191d22; margin: 0; }
table { width: 174mm; border-collapse: collapse; table-layout: fixed; }
td { vertical-align: top; }
.header { margin-bottom: 14mm; }
.brand { width: 90mm; }
.invoice-logo { display: block; width: 58mm; height: 7.07mm; }
.seller { width: 84mm; text-align: right; font-size: 8.5pt; color: #555; line-height: 1.6; }
.addresses { margin-bottom: 10mm; }
.addresses td { padding-right: 6mm; }
.eyebrow { font-size: 8pt; color: #646970; margin-bottom: 2mm; }
.customer-name { font-weight: bold; }
.title { border-bottom: 2pt solid #facf0c; padding-bottom: 4mm; margin-bottom: 5mm; }
h1 { font-size: 26pt; letter-spacing: -0.5pt; margin: 0; font-weight: bold; }
.reference { font-size: 10pt; color: #555; margin-top: 1mm; overflow-wrap: break-word; }
.paid { font-size: 22pt; font-weight: bold; text-align: right; vertical-align: middle; white-space: nowrap; color: #17613a; }
.meta { margin-bottom: 8mm; font-size: 9pt; }
.meta td { padding-right: 3mm; }
.meta-label { color: #646970; font-size: 8pt; margin-bottom: 1mm; }
.items { -fs-table-paginate: paginate; font-size: 9pt; }
.items thead { display: table-header-group; }
.items th { text-align: left; background: #f2f3f4; border-bottom: 0.7pt solid #bfc3c7; padding: 3mm 2mm; font-size: 8pt; }
.items td { padding: 3mm 2mm; border-bottom: 0.5pt solid #dfe2e5; }
.items tr { page-break-inside: avoid; }
.items .description { }
.items .qty { text-align: center; }
.items .numeric { text-align: right; white-space: nowrap; }
.item-name { font-weight: bold; overflow-wrap: break-word; }
.settings { margin-top: 2mm; font-size: 8pt; line-height: 1.6; color: #555; }
.summary { page-break-inside: avoid; margin-top: 6mm; }
.totals { margin-left: 69mm; width: 105mm; font-size: 9pt; }
.totals td { padding: 2mm 0; }
.totals .value { text-align: right; white-space: nowrap; }
.totals .grand td { font-weight: bold; font-size: 13pt; border-top: 1pt solid #191d22; border-bottom: 1pt solid #191d22; padding: 3mm 0; }
.notes { margin-top: 9mm; font-size: 9pt; }
.notes p { margin: 0 0 2mm; }
.muted { color: #646970; font-size: 8pt; }
.qr-page { page: qrpage; page-break-before: always; position: relative; height: 296.9mm; }
.qr-heading { padding: 20mm 18mm; }
.qr-heading h1 { font-size: 20pt; }
.qr-note { font-size: 10pt; width: 150mm; margin-top: 7mm; }
.qr-slip { position: absolute; left: 0; top: 192mm; width: 210mm; height: 105mm; }
.qr-slip svg { width: 210mm; height: 105mm; display: block; }
</style>
</head>
<body>
<div class="invoice-page">
<table class="header"><colgroup><col style="width:90mm"/><col style="width:84mm"/></colgroup><tr>
<td class="brand"><img class="invoice-logo" src="invoice-logo.svg" alt="3D Fab"/></td>
<td class="seller"><strong th:text="${sellerDisplayName}"></strong><br/><span th:text="${sellerAddressLine1}"></span><br/><span th:text="${sellerAddressLine2}"></span><br/><span th:text="${sellerEmail}"></span></td>
</tr></table>
<table class="addresses"><colgroup><col style="width:87mm"/><col style="width:87mm"/></colgroup><tr>
<td><div class="eyebrow" th:text="${labels.billing}"></div><div class="customer-name" th:text="${buyerDisplayName}"></div><div th:text="${buyerAddressLine1}"></div><div th:text="${buyerAddressLine2}"></div></td>
<td><div th:if="${shippingDisplayName != null}"><div class="eyebrow" th:text="${labels.shipping}"></div><div class="customer-name" th:text="${shippingDisplayName}"></div><div th:text="${shippingAddressLine1}"></div><div th:text="${shippingAddressLine2}"></div></div></td>
</tr></table>
<table class="title"><tr><td style="width:65%"><h1 th:text="${labels.invoice}"></h1><div class="reference" th:text="${invoiceNumber}"></div></td><td class="paid" th:unless="${isConfirmation}" th:text="${labels.paid}"></td></tr></table>
<table class="meta"><colgroup><col style="width:52mm"/><col style="width:52mm"/><col style="width:70mm"/></colgroup><tr>
<td><div class="meta-label" th:text="${labels.date}"></div><span th:text="${invoiceDate}"></span></td>
<td><div class="meta-label" th:text="${labels.due}"></div><span th:text="${dueDate}"></span></td>
<td><div class="meta-label" th:text="${labels.paymentMethod}"></div><span th:text="${paymentMethodText}"></span></td>
</tr></table>
<table class="items"><colgroup><col style="width:90mm"/><col style="width:16mm"/><col style="width:34mm"/><col style="width:34mm"/></colgroup><thead><tr>
<th class="description" th:text="${labels.description}"></th><th class="qty" th:text="${labels.quantity}"></th><th class="numeric" th:text="${labels.unitPrice}"></th><th class="numeric" th:text="${labels.amount}"></th>
</tr></thead><tbody><tr th:each="lineItem : ${invoiceLineItems}">
<td><div class="item-name" th:text="${lineItem.description}"></div><div class="settings" th:if="${lineItem['printSettings'] != null}" th:text="${lineItem['printSettings']}"></div></td>
<td class="qty" th:text="${lineItem.quantity}"></td><td class="numeric" th:text="${lineItem.unitPriceFormatted}"></td><td class="numeric" th:text="${lineItem.lineTotalFormatted}"></td>
</tr></tbody></table>
<div class="summary">
<table class="totals"><colgroup><col style="width:65mm"/><col style="width:40mm"/></colgroup><tr class="grand"><td th:text="${labels.total}"></td><td class="value" th:text="${grandTotalFormatted}"></td></tr>
<tr th:unless="${isConfirmation}"><td th:text="${labels.amountDue}"></td><td class="value">CHF 0.00</td></tr></table>
<div class="notes"><p th:text="${paymentTermsText}"></p><p class="muted" th:text="${labels.notes}"></p><p th:if="${isConfirmation}" th:text="${labels.thanks}"></p></div>
</div>
</div>
<div class="qr-page" th:if="${qrBillSvg != null}">
<div class="qr-heading"><img class="invoice-logo" src="invoice-logo.svg" alt="3D Fab" style="margin-bottom:15mm;"/><h1 th:text="${labels.qrTitle}"></h1><div class="reference" th:text="${invoiceNumber}"></div><p class="qr-note" th:text="${labels.qrNote}"></p></div>
<div class="qr-slip" th:utext="${qrBillSvg}"></div>
</div>
</body>
</html>
