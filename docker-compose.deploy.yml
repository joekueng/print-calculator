services:
  backend:
    # L'immagine usa il tag specificato nel file .env o passato da riga di comando
    # Nginx esterno deve servire /media/ con un alias verso
    # /mnt/cache/appdata/print-calculator/${ENV}/storage_media/public/
    image: ${REGISTRY_URL}/${REPO_OWNER}/print-calculator-backend:${TAG}
    container_name: print-calculator-backend-${ENV}
    ports:
      - "${BACKEND_PORT}:8000"
    environment:
      - SPRING_PROFILES_ACTIVE=${ENV}
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - CLAMAV_HOST=${CLAMAV_HOST}
      - CLAMAV_PORT=${CLAMAV_PORT}
      - CLAMAV_ENABLED=${CLAMAV_ENABLED}
      - TWINT_PAYMENT_URL=${TWINT_PAYMENT_URL:-}
      - MAIL_HOST=${MAIL_HOST:-mail.infomaniak.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-info@3d-fab.ch}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_SMTP_AUTH=${MAIL_SMTP_AUTH:-true}
      - MAIL_SMTP_STARTTLS=${MAIL_SMTP_STARTTLS:-true}
      - APP_MAIL_FROM=${APP_MAIL_FROM:-info@3d-fab.ch}
      - APP_MAIL_ADMIN_ENABLED=${APP_MAIL_ADMIN_ENABLED:-true}
      - APP_MAIL_ADMIN_ADDRESS=${APP_MAIL_ADMIN_ADDRESS:-info@3d-fab.ch}
      - APP_FRONTEND_BASE_URL=${APP_FRONTEND_BASE_URL:-http://localhost:4200}
      - APP_QR_TRUST_PROXY_HEADERS=${APP_QR_TRUST_PROXY_HEADERS:-false}
      - APP_QR_TRUSTED_PROXY_NETWORKS=${APP_QR_TRUSTED_PROXY_NETWORKS:-}
      - APP_QR_DEBUG_LOGGING=${APP_QR_DEBUG_LOGGING:-false}
      - APP_QR_GEO_ENABLED=${APP_QR_GEO_ENABLED:-false}
      - APP_QR_GEO_DB_PATH=${APP_QR_GEO_DB_PATH:-/app/cache/geoip/GeoLite2-City.mmdb}
      - APP_QR_GEO_LOCALES=${APP_QR_GEO_LOCALES:-it,en}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET}
      - ADMIN_SESSION_TTL_MINUTES=${ADMIN_SESSION_TTL_MINUTES:-480}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_TRANSLATION_MODEL=${OPENAI_TRANSLATION_MODEL:-}
      - OPENAI_TRANSLATION_TIMEOUT_SECONDS=${OPENAI_TRANSLATION_TIMEOUT_SECONDS:-}
      - OPENAI_TRANSLATION_PROMPT_CACHE_KEY_PREFIX=${OPENAI_TRANSLATION_PROMPT_CACHE_KEY_PREFIX:-}
      - OPENAI_TRANSLATION_BUSINESS_CONTEXT=${OPENAI_TRANSLATION_BUSINESS_CONTEXT:-}
      - LINKEDIN_SYNC_ENABLED=${LINKEDIN_SYNC_ENABLED:-true}
      - LINKEDIN_SYNC_CRON=${LINKEDIN_SYNC_CRON:-0 0 4 * * *}
      - LINKEDIN_SYNC_ZONE=${LINKEDIN_SYNC_ZONE:-Europe/Zurich}
      - LINKEDIN_ACCESS_TOKEN=${LINKEDIN_ACCESS_TOKEN:-}
      - LINKEDIN_ORGANIZATION_URN=${LINKEDIN_ORGANIZATION_URN:-}
      - LINKEDIN_API_VERSION=${LINKEDIN_API_VERSION:-202608}
      - LINKEDIN_POST_COUNT=${LINKEDIN_POST_COUNT:-5}
      - TEMP_DIR=/app/temp
      - PROFILES_DIR=/app/profiles
      - MEDIA_STORAGE_ROOT=${MEDIA_STORAGE_ROOT:-/app/storage_media}
      - SHOP_STORAGE_ROOT=${SHOP_STORAGE_ROOT:-/app/storage_shop}
      - MEDIA_FFMPEG_PATH=${MEDIA_FFMPEG_PATH:-/usr/local/bin/ffmpeg-media}
      - MEDIA_UPLOAD_MAX_FILE_SIZE_BYTES=${MEDIA_UPLOAD_MAX_FILE_SIZE_BYTES:-26214400}
      - QUOTE_RATE_LIMIT_MAX_REQUESTS=${QUOTE_RATE_LIMIT_MAX_REQUESTS:-15}
      - QUOTE_RATE_LIMIT_WINDOW_SECONDS=${QUOTE_RATE_LIMIT_WINDOW_SECONDS:-60}
      - QUOTE_RATE_LIMIT_TRUST_PROXY_HEADERS=${QUOTE_RATE_LIMIT_TRUST_PROXY_HEADERS:-false}
      - APP_CAD_UPLOAD_MAX_FILE_SIZE_BYTES=${APP_CAD_UPLOAD_MAX_FILE_SIZE_BYTES:-104857600}
      - APP_CAD_UPLOAD_MAX_FILES_PER_REQUEST=${APP_CAD_UPLOAD_MAX_FILES_PER_REQUEST:-20}
      - APP_MAIL_AUDIT_RETENTION_DAYS=${APP_MAIL_AUDIT_RETENTION_DAYS:-365}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes: 
      - backend_profiles_${ENV}:/app/profiles
      - /mnt/cache/appdata/print-calculator/${ENV}/storage_quotes:/app/storage_quotes
      - /mnt/cache/appdata/print-calculator/${ENV}/storage_orders:/app/storage_orders
      - /mnt/cache/appdata/print-calculator/${ENV}/storage_requests:/app/storage_requests
      - /mnt/cache/appdata/print-calculator/${ENV}/storage_media:/app/storage_media
      - /mnt/cache/appdata/print-calculator/${ENV}/storage_shop:/app/storage_shop
      - /mnt/cache/appdata/print-calculator/geoip:/app/cache/geoip:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: ${REGISTRY_URL}/${REPO_OWNER}/print-calculator-frontend:${TAG}
    container_name: print-calculator-frontend-${ENV}
    ports:
      - "${FRONTEND_PORT}:80"
    environment:
      - SSR_INTERNAL_API_ORIGIN=http://backend:8000
    depends_on:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend_profiles_prod:
  backend_profiles_int:
  backend_profiles_dev:
